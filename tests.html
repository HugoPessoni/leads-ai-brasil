<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testes</title>
  <style>
    body { margin: 0; padding: 16px; background: #000; color: #fff; font: 15px/1.4 system-ui, sans-serif; }
    h1 { margin: 0 0 12px; font-size: 20px; }
    #resumo { padding: 12px 14px; border-radius: 10px; font-weight: 700; color: #000; }
    .passou { background: #6bdd3e; }
    .falhou { background: #ff6b6b; }
    ul { padding: 0; list-style: none; }
    li { padding: 8px 0; border-bottom: 1px solid #2e2e2e; }
    li.erro { color: #ff8a8a; }
    pre { margin: 4px 0 0; white-space: pre-wrap; font-size: 13px; color: #ccc; }
  </style>
</head>
<body>
  <h1>Testes das funções puras (js/core.js)</h1>
  <div id="resumo">Rodando…</div>
  <ul id="lista"></ul>

  <script src="js/core.js"></script>
  <script>
    (function () {
      'use strict';
      var resultados = [];

      function teste(nome, fn) {
        try {
          fn();
          resultados.push({ nome: nome, ok: true });
        } catch (erro) {
          resultados.push({ nome: nome, ok: false, detalhe: erro.message });
        }
      }

      function igual(atual, esperado) {
        var a = JSON.stringify(atual);
        var e = JSON.stringify(esperado);
        if (a !== e) throw new Error('esperado ' + e + '\nrecebido ' + a);
      }

      function cracha(texto) {
        var r = Core.parseBadge(texto);
        return r && { prefixo: r.prefixo, id: r.id, codigo: r.codigo, nome: r.nome };
      }

      /* ---------- parseBadge: casos obrigatórios do PLANO.md ---------- */

      teste('Tabela: DOI-467956180/ANDERSON SANTOS', function () {
        igual(cracha('DOI-467956180/ANDERSON SANTOS'), { prefixo: 'DOI', id: '467956180', codigo: 'DOI-467956180', nome: 'Anderson Santos' });
      });
      teste('Tabela: FD-0D26715492/GABRIEL MONTEIRO', function () {
        igual(cracha('FD-0D26715492/GABRIEL MONTEIRO'), { prefixo: 'FD', id: '0D26715492', codigo: 'FD-0D26715492', nome: 'Gabriel Monteiro' });
      });
      teste('Tabela: DOI-56FE55826/SAULO SOUZA', function () {
        igual(cracha('DOI-56FE55826/SAULO SOUZA'), { prefixo: 'DOI', id: '56FE55826', codigo: 'DOI-56FE55826', nome: 'Saulo Souza' });
      });
      teste('Tabela: FD-0F79CE63CF/JHONNY RIBEIRO', function () {
        igual(cracha('FD-0F79CE63CF/JHONNY RIBEIRO'), { prefixo: 'FD', id: '0F79CE63CF', codigo: 'FD-0F79CE63CF', nome: 'Jhonny Ribeiro' });
      });
      teste('Dois códigos no mesmo texto: usa o primeiro (Anderson Santos)', function () {
        igual(cracha('DOI-467956180/ANDERSON SANTOS FD-0D26715492/GABRIEL MONTEIRO'), { prefixo: 'DOI', id: '467956180', codigo: 'DOI-467956180', nome: 'Anderson Santos' });
      });
      teste('Acento e partícula: DOI-ABC123/MARIA DA CONCEIÇÃO', function () {
        igual(cracha('DOI-ABC123/MARIA DA CONCEIÇÃO'), { prefixo: 'DOI', id: 'ABC123', codigo: 'DOI-ABC123', nome: 'Maria da Conceição' });
      });
      teste('Espaços e quebra de linha nas pontas', function () {
        igual(cracha('  \n DOI-467956180/ANDERSON SANTOS \r\n  '), { prefixo: 'DOI', id: '467956180', codigo: 'DOI-467956180', nome: 'Anderson Santos' });
      });
      teste('Texto sem barra retorna null', function () {
        igual(Core.parseBadge('DOI-467956180 ANDERSON SANTOS'), null);
      });
      teste('Texto vazio retorna null', function () {
        igual(Core.parseBadge(''), null);
        igual(Core.parseBadge('   '), null);
      });
      teste('URL qualquer retorna null', function () {
        igual(Core.parseBadge('https://www.google.com/search?q=cracha'), null);
      });

      /* ---------- parseBadge: retorno completo ---------- */

      teste('Retorna nomeOriginal e bruto', function () {
        var r = Core.parseBadge(' DOI-467956180/ANDERSON SANTOS ');
        igual(r.nomeOriginal, 'ANDERSON SANTOS');
        igual(r.bruto, ' DOI-467956180/ANDERSON SANTOS ');
      });
      teste('Minúsculas no QR viram código em maiúsculas', function () {
        igual(cracha('doi-56fe55826/saulo souza'), { prefixo: 'DOI', id: '56FE55826', codigo: 'DOI-56FE55826', nome: 'Saulo Souza' });
      });
      teste('Entrada que não é texto retorna null', function () {
        igual(Core.parseBadge(null), null);
        igual(Core.parseBadge(undefined), null);
      });

      /* ---------- formatarNome ---------- */

      teste('Nome em formato título com partículas', function () {
        igual(Core.formatarNome('JOÃO DOS SANTOS E SILVA'), 'João dos Santos e Silva');
      });
      teste('Primeira palavra sempre maiúscula, mesmo partícula', function () {
        igual(Core.formatarNome('da silva'), 'Da Silva');
      });
      teste('Hífen, apóstrofo e espaços extras', function () {
        igual(Core.formatarNome("  ana-maria   D'ÁVILA "), "Ana-Maria D'Ávila");
      });

      /* ---------- Celular ---------- */

      teste('Máscara de celular completo', function () {
        igual(Core.formatarCelular('11987654321'), '(11) 98765-4321');
      });
      teste('Máscara de fixo', function () {
        igual(Core.formatarCelular('1134567890'), '(11) 3456-7890');
      });
      teste('Máscara enquanto digita', function () {
        igual(Core.formatarCelular('1'), '(1');
        igual(Core.formatarCelular('11'), '(11');
        igual(Core.formatarCelular('119'), '(11) 9');
        igual(Core.formatarCelular('1198765'), '(11) 9876-5');
        igual(Core.formatarCelular(''), '');
      });
      teste('Máscara remove +55, letras e excesso', function () {
        igual(Core.formatarCelular('+55 (11) 98765-4321'), '(11) 98765-4321');
        igual(Core.formatarCelular('11a98765b4321999'), '(11) 98765-4321');
      });
      teste('Celular válido e inválido', function () {
        igual(Core.celularValido('(11) 98765-4321'), true);
        igual(Core.celularValido('(11) 3456-7890'), true);
        igual(Core.celularValido('(11) 9876-543'), false);
        igual(Core.celularValido('(01) 98765-4321'), false);
        igual(Core.celularValido('(11) 18765-4321'), false);
        igual(Core.celularValido(''), false);
      });

      /* ---------- E-mail ---------- */

      teste('E-mail válido e inválido', function () {
        igual(Core.emailValido('anderson@acme.com'), true);
        igual(Core.emailValido(' ana@empresa.com.br '), true);
        igual(Core.emailValido('anderson@acme'), false);
        igual(Core.emailValido('anderson acme.com'), false);
        igual(Core.emailValido(''), false);
      });

      /* ---------- validarCadastro ---------- */

      function campos(extra) {
        var base = { nome: 'Anderson Santos', celular: '(11) 98765-4321', email: 'anderson@acme.com', autorizou: true };
        for (var k in extra) base[k] = extra[k];
        return base;
      }
      function camposComErro(erros) {
        return erros.map(function (e) { return e.campo; });
      }

      teste('Cadastro completo não tem erros', function () {
        igual(Core.validarCadastro(campos({}), true), []);
      });
      teste('Contato: só celular segue para o QR', function () {
        igual(Core.validarCadastro(campos({ email: '' }), true), []);
      });
      teste('Contato: só e-mail segue para o QR', function () {
        igual(Core.validarCadastro(campos({ celular: '' }), true), []);
        igual(Core.validarCadastro(campos({ celular: '   ' }), true), []);
      });
      teste('Contato: celular e e-mail seguem para o QR', function () {
        igual(Core.validarCadastro(campos({}), true), []);
        igual(Core.validarCadastro(campos({ celular: '(11) 3456-7890' }), true), []);
      });
      teste('Sem celular e sem e-mail não deixa salvar', function () {
        var erros = Core.validarCadastro(campos({ celular: '', email: '  ' }), true);
        igual(camposComErro(erros), ['contato']);
        igual(erros[0].mensagem, 'Informe pelo menos um contato: celular ou e-mail.');
      });
      teste('Celular começado e não terminado: corrigir ou apagar', function () {
        igual(Core.validarCadastro(campos({ celular: '(11) 9876' }), true), [
          { campo: 'celular', mensagem: 'Celular incompleto: corrija com DDD ou apague para seguir só com o e-mail.' }
        ]);
        igual(Core.validarCadastro(campos({ celular: '98765-4321', email: '' }), true), [
          { campo: 'celular', mensagem: 'Celular incompleto: digite DDD + número.' }
        ]);
      });
      teste('E-mail inválido: corrigir ou apagar', function () {
        igual(Core.validarCadastro(campos({ email: 'anderson@' }), true), [
          { campo: 'email', mensagem: 'E-mail inválido: corrija ou apague para seguir só com o celular.' }
        ]);
        igual(camposComErro(Core.validarCadastro(campos({ email: 'anderson@', celular: '' }), true)), ['email']);
      });
      teste('Autorização obrigatória quando exigida', function () {
        igual(camposComErro(Core.validarCadastro(campos({ autorizou: false }), true)), ['autorizou']);
        igual(Core.validarCadastro(campos({ autorizou: false }), false), []);
      });
      teste('Nome vazio', function () {
        igual(camposComErro(Core.validarCadastro(campos({ nome: '  ' }), true)), ['nome']);
      });

      /* ---------- montarLead ---------- */

      function dadosLead(extra) {
        var base = {
          id: 'id-1',
          agora: new Date(Date.UTC(2026, 9, 28, 13, 5, 0)),
          voluntario: 'Ana',
          dispositivo: 'K7Q2XM',
          cracha: Core.parseBadge('DOI-467956180/ANDERSON SANTOS'),
          origemNome: 'qr',
          nome: '  Anderson   Santos ',
          empresa: ' Acme ',
          celular: '11987654321',
          email: ' Anderson@ACME.com ',
          autorizou: true,
          proximoPasso: 'reuniao',
          temperatura: 'quente',
          observacao: ' quer demo '
        };
        for (var k in extra) base[k] = extra[k];
        return base;
      }

      teste('montarLead com crachá lido', function () {
        igual(Core.montarLead(dadosLead({})), {
          id: 'id-1',
          capturado_em: '2026-10-28T13:05:00.000Z',
          status: 'pendente',
          voluntario: 'Ana',
          cracha_codigo: 'DOI-467956180',
          cracha_tipo: 'DOI',
          nome: 'Anderson Santos',
          empresa: 'Acme',
          celular: '(11) 98765-4321',
          email: 'anderson@acme.com',
          proximo_passo: 'reuniao',
          temperatura: 'quente',
          observacao: 'quer demo',
          autorizou_contato: true,
          origem_nome: 'qr',
          dispositivo: 'K7Q2XM'
        });
      });
      teste('montarLead digitado, sem crachá e sem celular', function () {
        var lead = Core.montarLead(dadosLead({ cracha: null, origemNome: 'manual', celular: '', proximoPasso: 'contato' }));
        igual([lead.cracha_codigo, lead.cracha_tipo, lead.celular, lead.origem_nome, lead.proximo_passo], ['', '', '', 'manual', 'contato']);
      });
      teste('montarLead guarda a temperatura (frio) e aceita lead antigo sem temperatura', function () {
        igual(Core.montarLead(dadosLead({ temperatura: 'frio' })).temperatura, 'frio');
        igual(Core.montarLead(dadosLead({ temperatura: undefined })).temperatura, '');
      });

      /* ---------- Datas e confirmação do envio ---------- */

      teste('mesmoDia usa o relógio do celular', function () {
        var agora = new Date(2026, 9, 28, 23, 50);
        igual(Core.mesmoDia(new Date(2026, 9, 28, 0, 5).toISOString(), agora), true);
        igual(Core.mesmoDia(new Date(2026, 9, 27, 23, 59).toISOString(), agora), false);
      });
      teste('formatarHorario hoje e outro dia', function () {
        var agora = new Date(2026, 9, 28, 18, 0);
        igual(Core.formatarHorario(new Date(2026, 9, 28, 14, 32).toISOString(), agora), 'hoje às 14:32');
        igual(Core.formatarHorario(new Date(2026, 9, 27, 9, 5).toISOString(), agora), '27/10 às 09:05');
      });
      teste('idsConfirmados junta gravados e ignorados', function () {
        igual(Core.idsConfirmados({ ok: true, gravados: ['a'], ignorados: ['b'] }), ['a', 'b']);
      });
      teste('idsConfirmados não confirma nada com erro ou resposta estranha', function () {
        igual(Core.idsConfirmados({ ok: false, erro: 'Token inválido' }), []);
        igual(Core.idsConfirmados(null), []);
        igual(Core.idsConfirmados({ ok: true }), []);
      });

      /* ---------- Backup ---------- */

      var leadsDoBackup = [
        Core.montarLead(dadosLead({})),
        Core.montarLead(dadosLead({ id: 'id-2', nome: 'MARIA DA CONCEIÇÃO', observacao: 'Ótima conversa 🔥 — voltar amanhã', temperatura: 'quente' }))
      ];

      teste('Backup começa com LEADS1: e volta igual (acentos e emoji)', function () {
        var texto = Core.codificarBackup(leadsDoBackup);
        igual(texto.indexOf('LEADS1:'), 0);
        igual(Core.decodificarBackup(texto), leadsDoBackup);
      });
      teste('Backup aceita quebras de linha e espaços no meio (WhatsApp, e-mail)', function () {
        var texto = Core.codificarBackup(leadsDoBackup);
        var quebrado = '  ' + texto.slice(0, 30) + '\n' + texto.slice(30, 80) + ' \r\n' + texto.slice(80) + '\n';
        igual(Core.decodificarBackup(quebrado), leadsDoBackup);
      });
      teste('Backup inválido retorna null', function () {
        igual(Core.decodificarBackup(''), null);
        igual(Core.decodificarBackup('olá'), null);
        igual(Core.decodificarBackup('LEADS1:isso não é base64'), null);
        igual(Core.decodificarBackup(Core.codificarBackup(leadsDoBackup).slice(0, 60)), null);
        igual(Core.decodificarBackup('LEADS1:' + btoa('{"nao":"lista"}')), null);
      });
      teste('Backup com muitos leads (500)', function () {
        var muitos = [];
        for (var i = 0; i < 500; i++) muitos.push(Core.montarLead(dadosLead({ id: 'id-' + i })));
        igual(Core.decodificarBackup(Core.codificarBackup(muitos)).length, 500);
      });
      teste('Nome do arquivo de backup sem acentos nem espaços', function () {
        igual(Core.nomeDoBackup('João da Silva', new Date(2026, 9, 28, 14, 32)), 'backup-leads-joao-da-silva-20261028-1432.txt');
        igual(Core.nomeDoBackup('', new Date(2026, 9, 29, 9, 5)), 'backup-leads-voluntario-20261029-0905.txt');
      });

      /* ---------- Resultado ---------- */

      var falhas = resultados.filter(function (r) { return !r.ok; }).length;
      var resumo = document.getElementById('resumo');
      resumo.textContent = falhas
        ? falhas + ' de ' + resultados.length + ' testes falharam'
        : 'Todos os ' + resultados.length + ' testes passaram';
      resumo.className = falhas ? 'falhou' : 'passou';
      document.title = (falhas ? '✘ ' : '✔ ') + resumo.textContent;

      var lista = document.getElementById('lista');
      resultados.forEach(function (r) {
        var item = document.createElement('li');
        item.className = r.ok ? '' : 'erro';
        item.textContent = (r.ok ? '✔ ' : '✘ ') + r.nome;
        if (!r.ok) {
          var pre = document.createElement('pre');
          pre.textContent = r.detalhe;
          item.appendChild(pre);
        }
        lista.appendChild(item);
      });
    })();
  </script>
</body>
</html>
