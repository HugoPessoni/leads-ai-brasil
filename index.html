<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Leads</title>
  <!-- Instalar na tela inicial (Android pelo manifest; iPhone pelas tags apple-*) -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Leads CEIA">
  <link rel="preload" href="fonts/rajdhani-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="barra">
    <div class="barra-voluntario">
      <span id="barra-nome" class="barra-nome"></span>
      <span id="barra-hoje" class="barra-hoje"></span>
    </div>
    <button id="barra-status" class="barra-status" type="button">Tudo enviado</button>
    <button id="botao-menu" class="botao-menu" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu">☰</button>
  </header>

  <nav id="menu" class="menu" hidden>
    <button type="button" data-acao="enviar">Enviar pendentes</button>
    <button type="button" data-acao="backup">Exportar backup</button>
    <button type="button" data-acao="trocar">Trocar voluntário</button>
  </nav>

  <main>
    <!-- 1. Identificação (só no primeiro uso) -->
    <section id="tela-identificacao" class="tela" hidden>
      <img class="logo" src="img/logo-ceia.png" alt="CEIA — Centro de Excelência em Inteligência Artificial">
      <p id="nome-evento" class="selo"></p>
      <h1><span class="fino">Qual é o</span> <span class="destaque">seu nome?</span></h1>
      <form id="form-identificacao" class="formulario" novalidate>
        <div class="campo">
          <label for="voluntario-nome">Seu nome</label>
          <input id="voluntario-nome" type="text" autocomplete="name" autocapitalize="words" enterkeyhint="go">
        </div>
        <button class="botao botao-principal" type="submit">Começar</button>
      </form>
    </section>

    <!-- 2. Cadastro -->
    <section id="tela-cadastro" class="tela" hidden>
      <button id="ler-cracha" class="botao botao-principal botao-grande" type="button">Ler crachá</button>
      <button id="digitar-nome" class="link" type="button">Digitar nome</button>
      <form id="form-cadastro" class="formulario" novalidate>
        <div class="campo">
          <label for="lead-nome">Nome</label>
          <input id="lead-nome" type="text" autocomplete="off" autocapitalize="words" enterkeyhint="next">
        </div>
        <div class="campo">
          <label for="lead-empresa">Empresa <span class="opcional">(opcional)</span></label>
          <input id="lead-empresa" type="text" autocomplete="off" autocapitalize="words" enterkeyhint="next">
        </div>
        <fieldset id="grupo-contato" class="grupo-contato">
          <legend>Contato <span class="opcional">— preencha pelo menos um</span></legend>
          <div class="campo">
            <label for="lead-celular">Celular</label>
            <input id="lead-celular" type="tel" inputmode="numeric" autocomplete="off" placeholder="(11) 98765-4321" enterkeyhint="next">
          </div>
          <div class="campo">
            <label for="lead-email">E-mail</label>
            <input id="lead-email" type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="nome@empresa.com" enterkeyhint="done">
          </div>
        </fieldset>
        <label class="checkbox">
          <input id="lead-autorizou" type="checkbox">
          <span>Autorizou o contato</span>
        </label>
        <button class="botao botao-principal" type="submit">Continuar</button>
      </form>
    </section>

    <!-- 3. Próximo passo -->
    <section id="tela-passo" class="tela" hidden>
      <h1><span class="fino">Qual o melhor</span> <span class="destaque">próximo passo?</span></h1>
      <div class="campo">
        <label for="lead-observacao">Observação <span class="opcional">(opcional)</span></label>
        <input id="lead-observacao" type="text" autocomplete="off" enterkeyhint="done">
      </div>
      <div id="botoes-passo" class="botoes-passo"></div>
      <button id="voltar-cadastro" class="link" type="button">Voltar</button>
    </section>

    <!-- 4. QR para a empresa -->
    <section id="tela-qr" class="tela tela-qr" hidden>
      <img class="logo" src="img/logo-ceia.png" alt="CEIA — Centro de Excelência em Inteligência Artificial">
      <h1 id="qr-titulo"></h1>
      <img id="qr-imagem" class="qr-imagem" alt="QR code">
      <p id="qr-erro" class="qr-erro" hidden></p>
      <button id="novo-lead" class="botao botao-principal botao-grande" type="button">Novo lead</button>
      <button id="trocar-opcao" class="link" type="button">Trocar opção</button>
    </section>
  </main>

  <!-- Leitor do QR do crachá: abre por cima de tudo -->
  <div id="leitor" class="leitor" hidden>
    <p class="leitor-instrucao">Aponte a câmera para o QR do crachá</p>
    <div id="leitor-video" class="leitor-video"></div>
    <button id="leitor-cancelar" class="botao botao-secundario" type="button">Cancelar</button>
  </div>

  <div id="aviso" class="aviso" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="vendor/html5-qrcode.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
